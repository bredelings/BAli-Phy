name: Upload release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "*"

defaults:
  run:
    shell: bash

jobs:
  build_singularity_and_upload:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: 3.12
    - uses: eWaterCycle/setup-apptainer@v2
      with:
        apptainer-version: 1.3.6

    - name: Get version
      id: get_version
      run: |
        echo "version=$(echo $GITHUB_REF | cut -d / -f 3)" >> $GITHUB_OUTPUT

    - name: Create singularity image
      id: create_image
      run: |
        PACKAGE=bali-phy-${{ steps.get_version.outputs.version }}-linux64-intel-singularity.sif
        singularity build --fakeroot --build-arg version=${{ steps.get_version.outputs.version }} ~/${PACKAGE} Singularity
        echo "archive_name=${PACKAGE}" >> $GITHUB_OUTPUT
        echo "archive_path=${HOME}/${PACKAGE}" >> $GITHUB_OUTPUT

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        name: Release ${{ github.ref }}
        files: ${{ steps.create_image.outputs.archive_path }}
        draft: true
        prerelease: false

  build_and_upload:
    strategy:
      matrix:
        # Manual runs validate only Windows and never publish release assets.
        include: >-
          ${{ fromJSON(github.event_name == 'workflow_dispatch' &&
            '[{"name": "windows-native-mingw", "os": "windows-latest", "compiler": "mingw", "version": "N/A", "arch": "win64"}]' ||
            '[
              {"name": "ubuntu-gcc-14-24.04", "os": "ubuntu-24.04", "compiler": "gcc", "version": "14", "cxxflags": "-march=x86-64-v3", "arch": "linux64"},
              {"name": "ubuntu-gcc-14-24.04-arm", "os": "ubuntu-24.04-arm", "compiler": "gcc", "version": "14", "arch": "linux64"},
              {"name": "ubuntu-gcc-15-26.04", "os": "ubuntu-26.04", "compiler": "gcc", "version": "15", "cxxflags": "-march=x86-64-v3", "arch": "linux64"},
              {"name": "ubuntu-gcc-15-26.04-arm", "os": "ubuntu-26.04-arm", "compiler": "gcc", "version": "15", "arch": "linux64"},
              {"name": "macos15-xcode16-intel", "os": "macos-15-intel", "compiler": "xcode", "version": "16", "cxxflags": "-march=x86-64-v3", "arch": "mac-intel64"},
              {"name": "macos16-xcode26-arm", "os": "macos-latest", "compiler": "xcode", "version": "26", "arch": "mac-arm64"},
              {"name": "windows-native-mingw", "os": "windows-latest", "compiler": "mingw", "version": "N/A", "arch": "win64"}
            ]') }}

    runs-on: ${{ matrix.os }}
    container:
      image: ${{ matrix.image || '' }}
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: 3.12

    # Caches for different branches are isolated, so we don't need to put the branch name into the key.
    # The total size for all caches in a repository is 5Gb.

    - name: Use a faster apt mirror
      if: runner.os == 'Linux'
      run: |
        # Use a faster, more reliable mirror
        if [ -n "${{ matrix.image }}" ]  ; then
            sed -i 's|http://archive.ubuntu.com|http://azure.archive.ubuntu.com|g' /etc/apt/sources.list
            sed -i 's|http://archive.ubuntu.com|http://azure.archive.ubuntu.com|g' /etc/apt/sources.list.d/ubuntu.sources
            apt-get update
        else
            sudo sed -i 's|http://archive.ubuntu.com|http://azure.archive.ubuntu.com|g' /etc/apt/sources.list
            sudo sed -i 's|http://archive.ubuntu.com|http://azure.archive.ubuntu.com|g' /etc/apt/sources.list.d/ubuntu.sources
            sudo apt-get update
        fi

    - name: Install (Linux)
      if: runner.os == 'Linux'
      run: |
        # If we're running in a docker image, we are already root
        if [ -n "${{ matrix.image }}" ]  ; then
          apt-get update && apt-get install -y sudo build-essential git cmake curl xz-utils
        fi 

        sudo apt-get update
        sudo apt-get install -y pandoc
        sudo apt-get install -y librange-v3-dev libeigen3-dev libcairo2-dev libcli11-dev libzstd-dev
        sudo apt-get install -y r-base

        if [ "${{ matrix.compiler }}" = "gcc" ] ; then
          echo "Installing g++-${{ matrix.version }}"
          echo sudo apt-get install -y g++-${{ matrix.version }}
          sudo apt-get install -y g++-${{ matrix.version }}
          g++-${{ matrix.version }} --version
          echo "CC=ccache gcc-${{ matrix.version }}" >> $GITHUB_ENV
          echo "CXX=ccache g++-${{ matrix.version }}" >> $GITHUB_ENV
        else
          echo "Installing clang-${{ matrix.version }}"
          sudo apt-get install -y clang-${{ matrix.version }}
          echo "CC=ccache clang-${{ matrix.version }}" >> $GITHUB_ENV
          echo "CXX=ccache clang++-${{ matrix.version }}" >> $GITHUB_ENV
        fi

        sudo rm -rf /usr/local/share/boost
        sudo apt-get install -y libboost-all-dev

    - name: Install (Windows native MinGW)
      if: matrix.name == 'windows-native-mingw'
      id: msys2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        path-type: inherit
        # MSYS2 Git materializes the test-data links below. The Perl packages it pulls in are
        # transitive CI dependencies; installed BAli-Phy does not require Perl.
        install: >-
          git
          mingw-w64-x86_64-boost
          mingw-w64-x86_64-cairo
          mingw-w64-x86_64-ccache
          mingw-w64-x86_64-cereal
          mingw-w64-x86_64-cli11
          mingw-w64-x86_64-eigen3
          mingw-w64-x86_64-fmt
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-meson
          mingw-w64-x86_64-ninja
          mingw-w64-x86_64-pkgconf
          mingw-w64-x86_64-range-v3
          mingw-w64-x86_64-zstd

    - name: Materialize test-data links (Windows native MinGW)
      if: matrix.name == 'windows-native-mingw'
      shell: msys2 {0}
      run: |
        # GitHub's Windows checkout materializes repository symlinks as ordinary files.
        # MSYS2 replaces each link with a copy that native Windows programs can read.
        git config --local core.symlinks true
        git checkout-index --force --all
        git ls-files -s tests | awk '$1 == "120000" {print $4}' |
          while IFS= read -r link; do
            target=$(git show ":$link")
            cmp -- "$link" "$(dirname "$link")/$target"
            # The copies differ from their symlink blobs but do not change the built sources.
            git update-index --assume-unchanged -- "$link"
          done

    - name: Configure native Windows environment
      if: matrix.name == 'windows-native-mingw'
      shell: pwsh
      run: |
        $mingwPrefix = Join-Path "${{ steps.msys2.outputs.msys2-location }}" "mingw64"
        $mingwBin = Join-Path $mingwPrefix "bin"
        if (-not (Test-Path (Join-Path $mingwBin "gcc.exe") -PathType Leaf)) {
          throw "MSYS2 GCC was not found in $mingwBin"
        }
        Add-Content -Path $env:GITHUB_PATH -Value $mingwBin
        Add-Content -Path $env:GITHUB_ENV -Value "BOOST_ROOT=$mingwPrefix"
        Add-Content -Path $env:GITHUB_ENV -Value "MINGW_PREFIX=$mingwPrefix"

        # GitHub sets ErrorActionPreference; extend fail-fast behavior to native commands.
        New-Item -ItemType Directory -Force (Split-Path $PROFILE.CurrentUserAllHosts) | Out-Null
        Add-Content $PROFILE.CurrentUserAllHosts '$PSNativeCommandUseErrorActionPreference = $true'

    - name: Select XCode version (macOS)
      if: runner.os == 'macOS' && matrix.compiler == 'xcode'
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ matrix.version }}

    - name: Install (macOS)
      if: runner.os == 'macOS'
      run: |
          if [ -n "${{ matrix.sdk }}" ]; then
             export SDKROOT=/Library/Developer/CommandLineTools/SDKs/MacOSX${{ matrix.sdk }}.sdk
             echo "SDKROOT=$SDKROOT" >> $GITHUB_ENV
          fi
          echo "SDKROOT=${SDKROOT}"

          if [ -n "${{ matrix.osx-version-min }}" ] ; then
             MIN="-mmacosx-version-min=${{ matrix.osx-version-min }}"
             echo "CFLAGS=$CFLAGS $MIN"     >> $GITHUB_ENV
             echo "CXXFLAGS=$CXXFLAGS $MIN" >> $GITHUB_ENV
             echo "LDFLAGS=$LDFLAGS $MIN"   >> $GITHUB_ENV
          fi

          export HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1 # Don't try and install python3.12
          brew install pandoc ccache coreutils
          brew install eigen range-v3 cairo cli11 fmt zstd
          brew install r
          if [ "${{ matrix.compiler }}" = "llvm" ] ; then
            brew install llvm
            LLVM_PREFIX="$(brew --prefix llvm)"
            echo "LLVM_PREFIX=${LLVM_PREFIX}" >> $GITHUB_ENV
            echo "CC=ccache ${LLVM_PREFIX}/bin/clang" >> $GITHUB_ENV
            echo "CXX=ccache ${LLVM_PREFIX}/bin/clang++" >> $GITHUB_ENV
            "${LLVM_PREFIX}/bin/clang++" --version
          else
            echo "CC=ccache clang" >> $GITHUB_ENV
            echo "CXX=ccache clang++" >> $GITHUB_ENV
          fi

          ( cd
            curl -O -L https://archives.boost.io/release/1.89.0/source/boost_1_89_0.tar.gz
            tar -xzf boost_1_89_0.tar.gz
            cd boost_1_89_0
            ./bootstrap.sh --with-libraries=atomic,chrono,filesystem,system,regex,thread,date_time,program_options,math,serialization,random,json --prefix=../installed-boost-1.89.0
            ./b2 install
            echo -e "\n    BOOST root is at $(cd ../installed-boost-1.89.0; pwd)\n"
            echo BOOST_ROOT=$(cd ../installed-boost-1.89.0; pwd) >> $GITHUB_ENV
          )
          echo "BOOST_ROOT=${BOOST_ROOT}"

    - name: Install Pandoc (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: choco install pandoc --no-progress -y

    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2.23
      with:
         install: ${{ runner.os == 'Linux' && 'binary' || 'detect' }}
         max-size: ${{ matrix.name == 'ubuntu-gcc-14-sanitize' && '1G' || '500M' }}
         # GitHub caches are immutable.  Timestamped SHA keys make each save unique, while
         # these prefixes restore the newest same-commit or preceding accessible cache.
         key: ${{ matrix.name }}-${{ github.sha }}
         restore-keys: |
           ${{ matrix.name }}-${{ github.sha }}
           ${{ matrix.name }}
         verbose: 2

    - name: Require ccache 4.10 or newer
      run: |
        ccache --version
        ccache_version=$(ccache --version | sed -n '1s/^ccache version //p' | tr -d '\r')
        case "$ccache_version" in
          ''|*[!0-9.]*)
            echo "Could not parse ccache version: $ccache_version" >&2
            exit 1
            ;;
        esac
        ccache_major=${ccache_version%%.*}
        ccache_rest=${ccache_version#*.}
        ccache_minor=${ccache_rest%%.*}
        if [ "$ccache_major" -lt 4 ] || {
          [ "$ccache_major" -eq 4 ] && [ "$ccache_minor" -lt 10 ]
        }; then
          echo "ccache $ccache_version is too old; version 4.10 or newer is required." >&2
          exit 1
        fi

    - name: Identify cached compilers by content
      if: matrix.name != 'windows-native-mingw'
      run: ccache --set-config=compiler_check=content

    - name: Install meson
      if: matrix.name != 'windows-native-mingw'
      run: |
        python3 -mpip install meson ninja

    - name: Download testiphy test suite
      uses: nick-fields/retry@v4
      with:
        timeout_minutes: 5
        max_attempts: 3
        command: |
          git clone https://gitlab.com/testiphy/testiphy.git "${{ runner.temp }}/testiphy"

    - name: Mark installs complete
      run: echo "INSTALLS_COMPLETE=true" >> $GITHUB_ENV

    - name: Choose test seed
      shell: bash
      run: |
        seed=$RANDOM
        echo "Test seed: $seed"
        echo "seed=$seed" >> "$GITHUB_ENV"

    - name: Configure
      if: matrix.name != 'windows-native-mingw'
      run: |
        CPPARGS=""
        if [ "${{ matrix.sanitize }}" != "" ] ; then
           # Keep symbols in instrumented builds so sanitizer reports name their source locations.
           CPPARGS="-g"
        fi
        if [ "${{ matrix.cxxflags }}" != "" ] ; then
           CPPARGS="$CPPARGS ${{ matrix.cxxflags }}"
        fi
        if [ "${{ matrix.assertions }}" = "true" ] ; then
           # Exercise optimized code with assertions, without retaining full debug information.
           ARGS="${ARGS} -Db_ndebug=false"
        fi
        if [ "${{ runner.os }}" = "Linux" ] && [ "${{ matrix.sanitize }}" != "" ] ; then
           # Address sanitizer can't find its dylibs on OS X?
           ARGS="${ARGS} -Db_sanitize=${{ matrix.sanitize }}"
        fi
        build_rpath_args=()
        if [ "${{ runner.os }}" = "macOS" ] && [ -n "${BOOST_ROOT}" ] ; then
           # Uninstalled executables need the custom Boost prefix; Meson removes it on install.
           build_rpath_args=("-Dbuild-rpath=${BOOST_ROOT}/lib")
        fi
        echo "SDKROOT = $SDKROOT"
        echo meson setup build --prefix=$HOME/local --buildtype=release -Dtest_seed="$seed" -Dcpp_args="$CPPARGS" "${build_rpath_args[@]}" ${ARGS}
        meson setup build --prefix=$HOME/local --buildtype=release -Dtest_seed="$seed" -Dcpp_args="$CPPARGS" "${build_rpath_args[@]}" ${ARGS}

    - name: Upload meson log if configure failed
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: meson-log-${{ matrix.name }}
        path: ${{ github.workspace }}/build/meson-logs/meson-log.txt

    - name: Build
      if: matrix.name != 'windows-native-mingw'
      run: |
        ccache -p
        ccache -s
        ninja -C build -j4
        meson install -C build --skip-subprojects
        ccache -s

    - name: Configure (Windows native MinGW)
      if: matrix.name == 'windows-native-mingw'
      shell: pwsh
      run: |
        $installPrefix = Join-Path $PWD "local"
        $env:CC = "ccache gcc"
        $env:CXX = "ccache g++"

        $tools = @("gcc.exe", "g++.exe", "meson.exe", "ninja.exe", "pkgconf.exe", "ccache.exe")
        Get-Command $tools -ErrorAction Stop | Select-Object Name, Source

        meson setup build "--prefix=$installPrefix" `
          "--buildtype=release" "-Dtest_seed=$env:seed"

    - name: Build (Windows native MinGW)
      if: matrix.name == 'windows-native-mingw'
      shell: pwsh
      run: |
        ccache -p
        ccache -s
        ninja -C build -j2
        meson install -C build --skip-subprojects

        # Catch a missing Cairo dependency even if Meson otherwise completes successfully.
        if (-not (Test-Path "build/src/draw-tree.exe" -PathType Leaf)) {
          throw "The build did not produce draw-tree.exe"
        }
        if (-not (Test-Path "local/bin/draw-tree.exe" -PathType Leaf)) {
          throw "The install did not include draw-tree.exe"
        }

        ccache -s

    - name: Get version
      id: get_version
      run: |
        version=$GITHUB_REF_NAME
        if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then version="validation-$GITHUB_RUN_ID"; fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Copy shared libs (Linux)
      if: matrix.arch == 'linux64'
      run: |
        OUTPUT=$HOME/local
        cp $(${CXX} -print-file-name=libstdc++.so.6) $OUTPUT/lib/bali-phy/libstdc++.so.6
        if [ -n "${BOOST_ROOT}" -a -e "${BOOST_ROOT}/lib" ] ; then
            # copy boost shared libs if they exist
            cp ${BOOST_ROOT}/lib/libboost*so* ${OUTPUT}/lib/bali-phy/
        else
            # apparently this only works for system libraries.
            for libname in $(ldd ${OUTPUT}/bin/bali-phy | grep libboost | sed s'/\s*lib\(boost.*\) =>.*/\1/') ; do
                echo cp $($CXX --print-file-name lib${libname}) ${OUTPUT}/lib/bali-phy/
                cp $($CXX --print-file-name lib${libname}) ${OUTPUT}/lib/bali-phy/
            done
        fi
        ldd ${OUTPUT}/bin/bali-phy

    - name: Copy shared libs (Mac)
      if: runner.os == 'macOS'
      run: |
        OUTPUT=$HOME/local

        # copy boost shared libs if they exist
        if [ -n "${BOOST_ROOT}" -a -e "${BOOST_ROOT}/lib" ] ; then
            cp ${BOOST_ROOT}/lib/libboost*dylib* ${OUTPUT}/lib/bali-phy/
        fi

    - name: Ad hoc sign Mac executables
      if: runner.os == 'macOS'
      run: |
        OUTPUT=$HOME/local
        brew install findutils file-formula
        for exe in $(gfind ${OUTPUT} -type f -executable -exec file --mime-type '{}' \; | grep x-mach-binary | sed 's/: application.*//') ; do
           echo codesign --sign - --force --timestamp=none ${exe}
           codesign --sign - --force --timestamp=none ${exe}
        done
        otool -L ${OUTPUT}/bin/bali-phy
        # otool -l ${OUTPUT}/bin/bali-phy
        codesign -d --verbose=4 ${OUTPUT}/bin/bali-phy

    - name: Test
      if: matrix.name != 'windows-native-mingw'
      run: |
        export UBSAN_OPTIONS=halt_on_error=1
        # Installed macOS binaries locate packaged libraries through their rpath. A prefix-wide
        # DYLD_LIBRARY_PATH also changes libraries loaded by unrelated Homebrew programs such as R.
        if [ -n "${BOOST_ROOT}" ] && [ "${{ runner.os }}" != "macOS" ] ; then
          export LD_LIBRARY_PATH="${BOOST_ROOT}/lib"
        fi
        export PATH=$HOME/local/bin:$PATH
        BALIPHY=bali-phy
        STATREPORT=statreport
        echo "Running installed-program tests with seed=$seed"

        echo ::group::Basic tests
        ${BALIPHY} help
        cp $HOME/local/share/doc/bali-phy/examples/5S-rRNA/5d-muscle.fasta .
        ${BALIPHY} --seed=$seed 5d-muscle.fasta --test
        ${BALIPHY} --seed=$seed 5d-muscle.fasta --iterations=50
        ${BALIPHY} --seed=$(($seed+1)) 5d-muscle.fasta --iterations=50
        ${STATREPORT} 5d-muscle-1/C1.log
        bpy-summarize 5d-muscle-1 5d-muscle-2
        rm -f token0.dot
        ${BALIPHY} --seed=$seed -V4 run tests/prob_prog/demos/airline/Model.hs --test
        test -s token0.dot

        # Use a reduced suite for DEBUG_MACHINE and sanitizer builds.
        skip=none
        case "${{ matrix.name }}" in
          *-DEBUG_MACHINE) skip=some ;;
          *-sanitize) skip=most ;;
        esac

        if [ "$skip" = "none" ] ; then
            echo ::group::Test suite
            meson test -C build --no-rebuild --print-errorlogs --num-processes 2
            echo ::endgroup::
        else
            echo ::group::Reduced test suite
            meson test -C build --no-rebuild --print-errorlogs --num-processes 2 \
              'bali-phy testsuite prob_prog/demos/*' \
              'bali-phy testsuite prob_prog/coal_mining' \
              'bali-phy testsuite prob_prog/cluster/*'
            echo ::endgroup::
        fi

        if [ "$skip" != "most" ] ; then
           cd "$RUNNER_TEMP/testiphy"
           rm -rf tests/likelihood/one-sequence

           echo ::group::testiphy variable A
           ./testiphy ${BALIPHY} --seed=$seed
           echo ::endgroup::

             echo ::group::testiphy fixed A
             ./testiphy ${BALIPHY} --seed=$seed -Inone
             echo ::endgroup::
        fi

    - name: Test (Windows native MinGW)
      if: matrix.name == 'windows-native-mingw'
      shell: pwsh
      run: |
        $installedBin = (Resolve-Path local/bin).Path
        $baliPhy = Join-Path $installedBin "bali-phy.exe"
        $env:PATH = "$installedBin;$env:PATH"

        & $baliPhy help
        & $baliPhy --version
        & $baliPhy "$env:GITHUB_WORKSPACE/examples/5S-rRNA/5d-muscle.fasta" --test
        & $baliPhy "--seed=$env:seed" -V4 run tests/prob_prog/demos/airline/Model.hs --test
        if (-not (Test-Path token0.dot -PathType Leaf)) { throw "Missing token0.dot" }
        if (-not (Test-Path local/share/man/man1/bali-phy.1 -PathType Leaf)) {
          throw "Generated manual pages were not installed"
        }

        # PowerShell passes native slash options without MSYS2 interpreting them as Unix paths.
        & $baliPhy "/version"

        meson test -C build --print-errorlogs --num-processes 2

    - name: Test bpy-summarize without R (Windows native)
      if: matrix.name == 'windows-native-mingw'
      shell: pwsh
      run: |
        $pythonDirectory = Split-Path (Get-Command python).Source
        $installedBin = (Resolve-Path local/bin).Path
        $env:PATH = "$installedBin;$pythonDirectory;$env:SystemRoot\System32"

        if (Get-Command R.exe -CommandType Application -ErrorAction SilentlyContinue) {
          throw "R unexpectedly remains available on the restricted PATH"
        }
        bpy-summarize --help
        cmd /c "bpy-summarize --help"
        bali-phy-pkg --help
        cmd /c "bali-phy-pkg --help"
        # Verify the installed runtime closure can load draw-tree without /mingw64/bin.
        draw-tree --help

        New-Item -ItemType Directory bpy-summarize-smoke | Out-Null
        Push-Location bpy-summarize-smoke
        bali-phy "$env:GITHUB_WORKSPACE\examples\5S-rRNA\5d-muscle.fasta" `
          "--seed=$env:seed" --iterations=50 --name=analysis-run

        $analysisOutput = bpy-summarize analysis-run-1 --outdir Results 2>&1 | Out-String
        $analysisOutput
        if ($analysisOutput -notmatch "Program 'R' not found") {
          throw "bpy-summarize did not report that R was unavailable"
        }
        if (-not (Test-Path Results/index.html)) {
          throw "bpy-summarize did not generate Results/index.html"
        }
        # Verify bpy-summarize can render through the packaged Cairo and fontconfig runtime.
        if (-not (Test-Path Results/greedy-tree.svg)) {
          throw "bpy-summarize did not generate Results/greedy-tree.svg"
        }
        if (-not (Select-String -Path Results/index.html -Pattern "Not generated: can't find R" -SimpleMatch -Quiet)) {
          throw "The report did not explain that its R-dependent figure was omitted"
        }
        Pop-Location

    - name: Testiphy (Windows native MinGW)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $env:PATH = "$(Resolve-Path local/bin);$env:PATH"
        # testiphy is Python and launches native executables directly; use the same suites as Unix.
        Push-Location (Join-Path $env:RUNNER_TEMP "testiphy")
        Remove-Item -Recurse -Force tests/likelihood/one-sequence
        python testiphy bali-phy "--seed=$env:seed"
        python testiphy bali-phy "--seed=$env:seed" -Inone
        Pop-Location

    - name: Upload tests if they failed
      uses: actions/upload-artifact@v4
      if: failure() && env.INSTALLS_COMPLETE == 'true'
      with:
        name: tests-${{ matrix.name }}
        path: tests
        
    - name: Create tarball
      id: create_tarball
      run: |
        OUTPUT=$HOME/local
        if [ "$RUNNER_OS" = Windows ]; then OUTPUT="$GITHUB_WORKSPACE/local"; fi
        PACKAGE=bali-phy-${{ steps.get_version.outputs.version }}
        ARCH=${{ matrix.arch }}
        if [ "$ARCH" = linux64 ] ; then ARCH=${{ matrix.os }} ; fi
        TAR=${PACKAGE}-${ARCH}.tar.gz
        cp -a "$OUTPUT" "$PACKAGE"
        tar -zcf "$TAR" "$PACKAGE"
        echo "archive=${TAR}" >> $GITHUB_OUTPUT

    - name: Test extracted Windows archive
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        ARCHIVE: ${{ steps.create_tarball.outputs.archive }}
        PACKAGE_VERSION: ${{ steps.get_version.outputs.version }}
      run: |
        # Test relocation and bundled dependencies, without the source or MSYS2 on PATH.
        $archive = Join-Path $PWD $env:ARCHIVE
        $pythonDirectory = Split-Path (Get-Command python).Source
        $unpack = Join-Path $env:RUNNER_TEMP "release archive check"
        New-Item -ItemType Directory $unpack | Out-Null
        tar -xzf $archive -C $unpack
        $package = Join-Path $unpack "bali-phy-$env:PACKAGE_VERSION"
        $env:PATH = "$package/bin;$pythonDirectory;$env:SystemRoot\System32"
        if (Get-Command R.exe -CommandType Application -ErrorAction SilentlyContinue) {
          throw "R unexpectedly remains available on the restricted PATH"
        }
        Push-Location $unpack
        bali-phy --version
        bali-phy help M8a_test
        draw-tree --help
        cmd /c "bpy-summarize --help"
        cmd /c "bali-phy-pkg --help"
        bali-phy "$package/share/doc/bali-phy/examples/5S-rRNA/5d-muscle.fasta" `
          "--seed=$env:seed" --iterations=50 --name=archive-run
        statreport archive-run-1/C1.log
        bpy-summarize archive-run-1 --outdir Results
        foreach ($file in @("Results/index.html", "Results/greedy-tree.svg")) {
          if (-not (Test-Path $file -PathType Leaf)) { throw "Missing $file" }
        }
        if (-not (Select-String -Path Results/index.html -Pattern "Not generated: can't find R" -SimpleMatch -Quiet)) {
          throw "The report did not explain that its R-dependent figure was omitted"
        }
        Pop-Location

    - name: Upload validation archive
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v4
      with:
        name: windows-release-validation
        path: ${{ steps.create_tarball.outputs.archive }}
        if-no-files-found: error

    - name: Upload Release Asset
      if: github.event_name != 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        name: Release ${{ github.ref }}
        files: ./${{ steps.create_tarball.outputs.archive }}
        draft: true
        prerelease: false

    - name: Get committer email
      if: failure() && env.INSTALLS_COMPLETE == 'true' && github.event_name != 'workflow_dispatch'
      id: get_email
      uses: actions/github-script@v7
      with:
        script: |
          const commit = await github.rest.repos.getCommit({
            owner: context.repo.owner,
            repo: context.repo.repo,
            ref: context.sha
          });
          return commit.data.commit.author.email;
        result-encoding: string

    - name: Email notification for upterm session
      if: failure() && env.INSTALLS_COMPLETE == 'true' && github.event_name != 'workflow_dispatch'
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "upterm session available: ${{ matrix.name }} on ${{ github.ref_name }}"
        to: ${{ steps.get_email.outputs.result }}
        from: ${{ secrets.EMAIL_USERNAME }}
        body: |
          A build failure triggered an upterm debug session.

          Job: ${{ matrix.name }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}

          Check the Actions log for SSH connection details:
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}


    - name: Setup upterm session on failure
      if: failure() && env.INSTALLS_COMPLETE == 'true' && github.event_name != 'workflow_dispatch'
      uses: owenthereal/action-upterm@v1
      with:
        limit-access-to-actor: true
        wait-timeout-minutes: 30
        
